name: Build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pishimusic-debug
          path: app/build/outputs/apk/debug/*.apk

      # Rolling debug release: every push to main republishes the debug APK
      # under the fixed `debug-latest` tag so there is always a direct
      # download link (Releases -> "PishiMusic — latest debug build").
      - name: Publish debug APK to Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest \
              --title "PishiMusic — latest debug build" \
              --notes "Rolling debug build from the main branch, published by CI."
          fi
          gh release upload debug-latest app/build/outputs/apk/debug/*.apk --clobber

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # lint is configured abortOnError in app/build.gradle.kts, and
      # checkReleaseBuilds=true makes this job analyze the release
      # variant too.
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

  release:
    name: Release build (ephemeral test key)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # CI-only throwaway keystore: exercises R8 shrinking and the
      # release signing guard end-to-end without any real key material.
      # The key is generated on the runner and never leaves it.
      - name: Generate ephemeral CI keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-release.jks" \
            -alias release_key -keyalg RSA -keysize 2048 -validity 30 \
            -storepass ci-test-password -keypass ci-test-password \
            -dname "CN=Tuned CI, O=CI, C=US"

      - name: Build release APK with test key
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/ci-release.jks
          RELEASE_STORE_PASSWORD: ci-test-password
          RELEASE_KEY_ALIAS: release_key
          RELEASE_KEY_PASSWORD: ci-test-password
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pishimusic-release-ci-test-key
          path: app/build/outputs/apk/release/*.apk
